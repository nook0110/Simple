name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gcc:16
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up dependencies
      run: |
        apt-get update
        apt-get install -y wget unzip g++ make git cmake lsb-release gnupg

    - name: Set up clang
      if: matrix.compiler == 'clang'
      run: |
        wget -qO llvm.sh https://apt.llvm.org/llvm.sh
        bash llvm.sh 23
        gcc_install_dir=$(dirname "$(g++ -print-libgcc-file-name)")
        echo "CC=clang-23" >> "$GITHUB_ENV"
        echo "CXX=clang++-23" >> "$GITHUB_ENV"
        echo "CXXFLAGS=--gcc-install-dir=$gcc_install_dir" >> "$GITHUB_ENV"
        echo "LDFLAGS=--gcc-install-dir=$gcc_install_dir" >> "$GITHUB_ENV"

    - name: Building the project
      working-directory: ${{runner.workspace}}/Simple
      run: |
        mkdir build
        cmake -DBUILD_TESTS=True -DCMAKE_BUILD_TYPE=Release -B build
        cmake --build build -t SCE_tests

    - name: Run tests
      working-directory: ${{runner.workspace}}/Simple/build
      run: |
        ulimit -s unlimited
        ctest -E "BestMove.WinAtChess"
