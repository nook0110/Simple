name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            image: gcc:16
          - compiler: clang
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up dependencies
      run: |
        apt-get update
        apt-get install -y wget unzip g++ make git cmake python3

    - name: Set up clang
      if: matrix.compiler == 'clang'
      run: |
        apt-get install -y lsb-release gnupg software-properties-common
        wget -qO llvm.sh https://apt.llvm.org/llvm.sh
        bash llvm.sh 23
        echo "CC=clang-23" >> "$GITHUB_ENV"
        echo "CXX=clang++-23" >> "$GITHUB_ENV"

    - name: Building the project
      working-directory: ${{runner.workspace}}/Simple
      run: |
        mkdir build
        cmake -DBUILD_TESTS=True -DCMAKE_BUILD_TYPE=Release -B build
        cmake --build build -t SCE_tests

    - name: Run tests
      working-directory: ${{runner.workspace}}/Simple/build
      run: |
        ulimit -s unlimited
        ctest -E "BestMove.WinAtChess"
