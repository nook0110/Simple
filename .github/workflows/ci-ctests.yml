name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip sudo g++ make git cmake

    - name: Install glog
      run: |
        git clone https://github.com/google/glog.git
        cd glog && cmake -S . -B build -G "Unix Makefiles"
        cmake --build build
        sudo cmake --build build --target install

    - name: Building the project
      working-directory: ${{runner.workspace}}/Simple
      run: |
        mkdir build
        cmake -DCMAKE_BUILD_TYPE=Release -B build
        cmake --build build -t SCE_tests

    - name: Run tests
      working-directory: ${{runner.workspace}}/Simple/build
      run: |
        ulimit -s unlimited
        ctest -E "BestMove.WinAtChess"
