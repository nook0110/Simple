name: CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: gcc:15
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake git wget unzip
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSCE_WARNINGS_AS_ERRORS=ON
          cmake --build build -j2
      - name: Download and verify NNUE
        run: |
          for network in nn-37f18f62d772.nnue nn-1c0000000000.nnue; do
            wget -q "https://tests.stockfishchess.org/api/nn/$network" -O "build/$network"
            hash=$(sha256sum "build/$network" | cut -c1-12)
            expected=${network#nn-}
            test "$hash" = "${expected%.nnue}"
          done
      - name: Run tests
        env:
          SCE_NNUE_SMALL: ${{ github.workspace }}/build/nn-37f18f62d772.nnue
          SCE_NNUE_BIG: ${{ github.workspace }}/build/nn-1c0000000000.nnue
        run: |
          ulimit -s unlimited
          ctest --test-dir build -j1 --output-on-failure --timeout 300 -E 'SharedClusterTable.ConcurrentEntriesStayConsistent|LazySmpUciLifecycle|WinAtChess|StopRestoresPosition'
      - name: Check perft
        run: |
          set -o pipefail
          printf 'position startpos\ngo perft 5\nquit\n' | build/SimpleChessEngine | grep -q '^Leafs: 4865609$'
          printf 'position fen r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1\ngo perft 4\nquit\n' | build/SimpleChessEngine | grep -q '^Leafs: 4085603$'
      - name: Check bench signature
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          expected=$(git log -1 --format=%B | sed -n 's/^Bench: \([0-9][0-9]*\)$/\1/p')
          [[ "$expected" =~ ^[0-9]+$ ]]
          actual=$(cd build && ./SimpleChessEngine bench | sed -n 's/^Nodes searched: \([0-9][0-9]*\)$/\1/p')
          test "$actual" = "$expected"

  sanitizer:
    runs-on: ubuntu-latest
    container:
      image: gcc:15
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake git wget unzip
      - name: Build
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DSCE_SANITIZE=ON -DSCE_WARNINGS_AS_ERRORS=ON -DCMAKE_C_FLAGS_DEBUG="-Og -g" -DCMAKE_CXX_FLAGS_DEBUG="-Og -g"
          cmake --build build-sanitize -j2
      - name: Download and verify NNUE
        run: |
          for network in nn-37f18f62d772.nnue nn-1c0000000000.nnue; do
            wget -q "https://tests.stockfishchess.org/api/nn/$network" -O "build-sanitize/$network"
            hash=$(sha256sum "build-sanitize/$network" | cut -c1-12)
            expected=${network#nn-}
            test "$hash" = "${expected%.nnue}"
          done
      - name: Run tests
        env:
          SCE_NNUE_SMALL: ${{ github.workspace }}/build-sanitize/nn-37f18f62d772.nnue
          SCE_NNUE_BIG: ${{ github.workspace }}/build-sanitize/nn-1c0000000000.nnue
        run: |
          ctest --test-dir build-sanitize -j1 --output-on-failure --timeout 300 -E 'SharedClusterTable.ConcurrentEntriesStayConsistent|LazySmpUciLifecycle|WinAtChess|StopRestoresPosition|BestMoveTest.FindBestMove|PerftTests/GenerateMovesTest.Perft/Position[1-4]|SyzygySearchRegression'
      - name: Check tablebase search under sanitizers
        env:
          SCE_NNUE_SMALL: ${{ github.workspace }}/build-sanitize/nn-37f18f62d772.nnue
        run: ctest --test-dir build-sanitize -R '^SyzygySearchRegression$' --output-on-failure --timeout 300
      - name: Search three positions
        run: python3 Tests/sanitizer_smoke.py --engine build-sanitize/SimpleChessEngine
